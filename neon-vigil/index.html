<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NV Mesh Viewer</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.4.0/dist/model-viewer.min.js"></script>
<style>
body { background-color: #0a0a12; color: #ffffff; font-family: Arial, Helvetica, sans-serif; margin: 0; text-align: center; }
header { padding: 2rem 1rem 1rem; }
h1 { color: #ff2da6; letter-spacing: 0.2em; margin: 0; }
p.subtitle { color: #00e5ff; font-size: 1.25rem; margin: 0.5rem 0 0; }
section { padding: 2rem 1rem; border-top: 2px solid #ff2da6; }
h2 { color: #00e5ff; letter-spacing: 0.1em; margin: 0 0 1rem; }
model-viewer { width: 100%; max-width: 900px; height: 600px; background-color: #0a0a12; margin: 1rem auto; display: block; }
.note { max-width: 700px; margin: 1rem auto; padding: 0 1rem; }
</style>
</head>
<body>
<header>
<h1>NV Mesh Viewer</h1>
<p class="subtitle">Scroll through the models below</p>
</header>
<main>
<section>
<h2>infinity6-spaceship-package</h2>
<model-viewer src="models/infinity6-spaceship-package.glb" camera-controls auto-rotate alt="infinity6-spaceship-package 3D model" style="background-color: #0a0a12;"></model-viewer>
</section>
<section>
<h2>infinity6-animated-ramp-airlock</h2>
<model-viewer src="models/infinity6-animated-ramp-airlock.glb" camera-controls auto-rotate alt="infinity6-animated-ramp-airlock 3D model" style="background-color: #0a0a12;"></model-viewer>
</section>
<section>
<h2>infinity6-shapewarp</h2>
<model-viewer src="models/infinity6-shapewarp.glb" camera-controls auto-rotate alt="infinity6-shapewarp 3D model" style="background-color: #0a0a12;"></model-viewer>
</section>
<section>
<h2>infinity6-verans</h2>
<model-viewer src="models/infinity6-verans.glb" camera-controls auto-rotate alt="infinity6-verans 3D model" style="background-color: #0a0a12;"></model-viewer>
</section>
<section>
<h2>infinity6-lockfit-solid</h2>
<model-viewer src="models/infinity6-lockfit-solid.glb" camera-controls auto-rotate alt="infinity6-lockfit-solid 3D model" style="background-color: #0a0a12;"></model-viewer>
</section>
<section>
<h2>infinity6-detailed</h2>
<model-viewer src="models/infinity6-detailed.glb" camera-controls auto-rotate alt="infinity6-detailed 3D model" style="background-color: #0a0a12;"></model-viewer>
</section>
<section>
<h2>infinity6-clunky</h2>
<model-viewer src="models/infinity6-clunky.glb" camera-controls auto-rotate alt="infinity6-clunky 3D model" style="background-color: #0a0a12;"></model-viewer>
</section>
<section>
<h2>infinity6-window-proof</h2>
<model-viewer src="models/infinity6-window-proof.glb" camera-controls auto-rotate alt="infinity6-window-proof 3D model" style="background-color: #0a0a12;"></model-viewer>
</section>
<section>
<h2>infinity6-recolored</h2>
<model-viewer src="models/infinity6-recolored.glb" camera-controls auto-rotate alt="infinity6-recolored 3D model" style="background-color: #0a0a12;"></model-viewer>
</section>
<section>
<h2>infinity6-lockfit</h2>
<model-viewer src="models/infinity6-lockfit.glb" camera-controls auto-rotate alt="infinity6-lockfit 3D model" style="background-color: #0a0a12;"></model-viewer>
</section>
</main>
</body>
</html>
